<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,email=no,address=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="X-Finance">
<meta name="application-name" content="X-Finance">
<meta name="msapplication-TileColor" content="#2F6B58">
<title>X-Finance</title>
<meta name="description" content="X-Finance: учёт исламской рассрочки и долгов">
<meta name="theme-color" content="#F7F2E9">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--CSS--><style>
:root{
  --bg:#F7F2E9;--ink:#2B2621;--muted:#8F8576;--line:rgba(160,135,95,.18);
  --glass:linear-gradient(145deg,rgba(255,255,255,.86),rgba(255,255,255,.58));
  --glass-b:rgba(255,255,255,.95);
  --accent:#2F6B58;--accent-soft:rgba(47,107,88,.10);
  --warn:#B9573A;--warn-soft:rgba(185,87,58,.10);--gold:#A8823F;--gold-soft:rgba(168,130,63,.12);
  --r:22px;--blur:blur(22px) saturate(170%);
  --shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(110,85,45,.05),0 12px 32px -8px rgba(110,85,45,.13);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;min-height:calc(100dvh / var(--z,1))}
body{color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body:before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(28vmax 24vmax at 22% 30%,rgba(232,204,150,.55),transparent 70%),radial-gradient(26vmax 22vmax at 78% 22%,rgba(160,204,182,.45),transparent 70%),
  radial-gradient(30vmax 26vmax at 70% 78%,rgba(244,190,165,.42),transparent 70%),radial-gradient(22vmax 20vmax at 25% 82%,rgba(170,196,222,.35),transparent 70%);
  transform:translateZ(0)}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(4%,-3%,0) rotate(8deg)}100%{transform:translate3d(-4%,3%,0) rotate(-6deg)}}
html{background:radial-gradient(70vmax 60vmax at 0% 0%,#FFFFFF 0,transparent 62%),radial-gradient(60vmax 50vmax at 105% 18%,#EFE2CB 0,transparent 60%),
  radial-gradient(55vmax 50vmax at 20% 105%,#E3EDE4 0,transparent 60%),radial-gradient(50vmax 45vmax at 95% 95%,#F6E6DA 0,transparent 62%),var(--bg);background-attachment:fixed}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
h1{font-size:27px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.025em}
h2{font-size:12.5px;margin:28px 2px 10px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 a,h2 button{color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}
.up{color:var(--warn)}.down{color:var(--accent)}

.app{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.app.bare{padding-bottom:24px}
main{max-width:1080px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 24px}
main.narrow{max-width:700px}
main.enter>*{animation:rise .5s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}
main.enter>*:nth-child(5){animation-delay:.16s}main.enter>*:nth-child(6){animation-delay:.2s}main.enter>*:nth-child(n+7){animation-delay:.24s}
main.enter .list>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + .1s)}

.glass,.card{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow)}
.card{border-radius:var(--r);position:relative}
.pad{padding:18px}

nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;border-radius:28px;padding:6px;max-width:520px;margin:0 auto;
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.6));-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 #fff,0 14px 36px -6px rgba(110,85,45,.25)}
nav .logo,nav .desk{display:none}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border-radius:22px;font-size:10.5px;color:var(--muted);min-width:0;transition:color .2s,background .25s,transform .15s}
nav a:active{transform:scale(.94)}
nav a svg{width:23px;height:23px;transition:transform .3s var(--ease)}
nav a.on{color:var(--accent);font-weight:650;background:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(110,85,45,.1)}
nav a.on svg{transform:translateY(-1px) scale(1.06)}
nav a span{position:relative}
nav a i{position:absolute;top:-25px;right:-13px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--warn);color:#fff;font-size:10px;font-style:normal;font-weight:700;display:grid;place-items:center}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top .sub{color:var(--muted);font-size:14px;margin-top:3px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;margin-bottom:10px;padding:6px 10px 6px 0}
.back svg{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:16px;font-weight:600;font-size:15px;white-space:nowrap;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-b);box-shadow:var(--shadow);transition:transform .12s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:linear-gradient(160deg,#3A7E69,#2B6351);color:#fff;border-color:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 22px -8px rgba(47,107,88,.6)}
.btn.danger{color:var(--warn)}
.btn.soft{color:var(--accent)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 13px;font-size:14px;border-radius:13px}
.btn.load{opacity:.6;pointer-events:none}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1}

.hero{padding:22px 22px 20px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% -20% auto auto;width:70%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent);pointer-events:none}
.hero .l{font-size:14px;color:var(--muted);position:relative}
.hero .v{font-size:40px;font-weight:750;letter-spacing:-.035em;line-height:1.1;margin:4px 0 2px;position:relative}
.hero .s{font-size:13px;color:var(--muted);position:relative}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.2;transition:transform .12s}
.act:active{transform:scale(.95)}
.act span{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.act.w span{background:var(--warn-soft);color:var(--warn)}.act.g span{background:var(--gold-soft);color:var(--gold)}
.act svg{width:22px;height:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{padding:14px 16px;display:block}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.stat.warn .v{color:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:10px;margin-top:10px}
.kpi{--t:var(--accent);--ts:var(--accent-soft);--orb:rgba(76,154,130,.30);--mx:30%;--my:0%;--rx:0deg;--ry:0deg;display:block;text-align:left;padding:17px 17px 16px;overflow:hidden;isolation:isolate;border-radius:26px;
  background:linear-gradient(150deg,rgba(255,255,255,.82),rgba(255,255,255,.42));
  border:1px solid rgba(255,255,255,.8);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -10px 24px -14px rgba(255,255,255,.7),inset 0 0 0 .5px rgba(255,255,255,.4),0 1px 2px rgba(110,85,45,.05),0 18px 38px -20px rgba(110,85,45,.32);
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .6s var(--ease),box-shadow .5s var(--ease);
  animation:kin .8s var(--ease) backwards;animation-delay:calc(var(--i,0)*65ms)}
.kpi:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(120% 70% at var(--mx) var(--my),rgba(255,255,255,.75),transparent 55%),linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%) no-repeat;
  background-size:100% 100%,250% 100%;background-position:0 0,160% 0;animation:sheen 1.6s ease-out both;animation-delay:calc(var(--i,0)*65ms + .35s);mix-blend-mode:soft-light}
.kpi:after{content:"";position:absolute;z-index:-1;right:-40px;top:-46px;width:150px;height:150px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 40%,var(--orb),transparent 72%);animation:orb 9s ease-in-out 2 alternate both;animation-delay:calc(var(--i,0)*-1.3s)}
.kpi:active{transform:perspective(900px) scale(.965);transition-duration:.15s}
@media(hover:hover) and (pointer:fine){.kpi:hover{box-shadow:inset 0 1.5px 0 #fff,inset 0 -10px 24px -14px rgba(255,255,255,.8),0 2px 4px rgba(110,85,45,.05),0 28px 50px -22px rgba(110,85,45,.42)}}
@keyframes kin{from{opacity:0;transform:perspective(900px) translateY(18px) scale(.94);filter:blur(6px)}}
@keyframes sheen{to{background-position:0 0,-60% 0}}
@keyframes orb{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-22px,16px) scale(1.18)}}
@keyframes bob{to{transform:translateY(-3px)}}
.kpi .ic{animation:bob 3.2s ease-in-out 4 alternate;animation-delay:calc(var(--i,0)*-.4s)}
.kpi.gold{--t:var(--gold);--ts:var(--gold-soft);--orb:rgba(214,170,90,.38)}.kpi.warn{--t:var(--warn);--ts:var(--warn-soft);--orb:rgba(226,128,98,.32)}.kpi.sky{--t:#4D7C99;--ts:rgba(77,124,153,.12);--orb:rgba(110,160,196,.34)}.kpi.ink{--t:#6B6257;--ts:rgba(107,98,87,.10);--orb:rgba(160,145,125,.28)}
.kpi.hot{--orb:rgba(226,108,78,.45)}
.kpi .ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(150deg,rgba(255,255,255,.75),rgba(255,255,255,.2)),var(--ts);color:var(--t);margin-bottom:14px;position:relative;z-index:2;border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 #fff,0 6px 14px -8px var(--t)}
.kpi.solid .ic{background:linear-gradient(160deg,#79A8C3,#4D7C99);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -6px rgba(77,124,153,.6)}
.kpi .ic svg{width:22px;height:22px}
.kpi .go{position:absolute;right:14px;top:18px;color:var(--muted);opacity:.6;z-index:2;transition:transform .4s var(--ease),opacity .3s}.kpi:hover .go{transform:translateX(3px);opacity:1}.kpi .go svg{width:17px;height:17px;transform:rotate(180deg);display:block}
.kpi .l,.kpi .v,.kpi .s{z-index:2}
.kpi .l{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);position:relative;line-height:1.3}
.kpi{display:flex!important;flex-direction:column;min-width:0;min-height:158px;container-type:inline-size}
.kpi .ic{flex:none}
.kpi .kb{margin-top:auto;position:relative;z-index:2;min-width:0}
.kpi .l{min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:clamp(10px,7.2cqw,11.5px)!important}
.kpi .v{font-size:clamp(16px,13cqw,27px);font-weight:750;letter-spacing:-.025em;margin-top:3px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,8.4cqw,12.5px)!important}
.kpi.hot .v{color:var(--warn)}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px;position:relative}
.kvs{padding:6px 18px 18px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:50px;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted);font-size:15px}
.kv b{font-weight:600;font-size:16px;text-align:right;white-space:normal}
.kv b i{font-style:normal;font-weight:650;font-size:12px;padding:3px 8px;border-radius:10px;background:var(--gold-soft);color:var(--gold);margin-left:6px}
.c-acc{color:#3F7391;font-weight:700!important}.c-gold{color:#B4741F;font-weight:700!important}.c-ok{color:var(--accent);font-weight:700!important}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pt{border-radius:17px;padding:13px 15px;background:rgba(77,124,153,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.pt.ok{background:rgba(47,107,88,.09)}
.pt span{display:block;font-size:13px;color:#4D7C99}.pt.ok span{color:var(--accent)}
.pt b{display:block;font-size:20px;font-weight:750;letter-spacing:-.02em;margin-top:3px;color:#355E78}.pt.ok b{color:#24584A}
.sched{overflow:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh b{font-size:17px;letter-spacing:-.01em}
.sh.ok{background:linear-gradient(90deg,rgba(47,107,88,.09),transparent)}.sh.ok b{color:#24584A}
.cnt{min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.none{text-align:center;color:var(--muted);padding:26px 16px}
.tr{display:grid;grid-template-columns:1.05fr 1fr auto;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid var(--line);min-height:60px}
.tr:nth-child(even){background:rgba(160,135,95,.045)}
.tr.th{min-height:0;padding:11px 18px;border-top:0;background:none;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tr>span:last-child{min-width:104px;text-align:right}.tr.th>span:last-child{text-align:left}
.tr small{display:block;font-size:11.5px;color:var(--muted)}
.tr.overdue>span:first-child,.tr.overdue small{color:var(--warn)}
.tr.paid>span:first-child,.tr.paid b{color:var(--muted);font-weight:500}
.tr b{font-weight:700}
.take{color:var(--accent);border-color:rgba(47,107,88,.28);box-shadow:none;background:rgba(255,255,255,.8);height:40px;padding:0 16px}
.list{display:grid;gap:10px}.list>*{min-width:0}
.item .h .t{min-width:0}
.item{display:block;padding:15px 17px;transition:transform .15s var(--ease),box-shadow .2s}
.item:active{transform:scale(.985)}
.item .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{font-weight:700}
.item .f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:rgba(160,135,95,.16);overflow:hidden;margin-top:12px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#4C9A82,#2F6B58);border-radius:3px;transition:width .9s var(--ease)}
.bar.warn b{background:linear-gradient(90deg,#D98A6C,#B9573A)}
.chip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:650;background:rgba(160,135,95,.12);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip svg{width:13px;height:13px}
.ava{width:42px;height:42px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.item.with-ava{display:flex;gap:13px;align-items:center}.item.with-ava>div:last-child{flex:1;min-width:0}

.seg{display:flex;background:rgba(160,135,95,.13);border-radius:16px;padding:4px;gap:2px;margin-bottom:12px}
.seg button{flex:1;height:38px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;padding:0 6px;transition:background .25s,color .2s,box-shadow .25s}
.seg button.on{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 2px 8px rgba(110,85,45,.12)}
.seg button em{font-style:normal;font-weight:500;opacity:.65;margin-left:4px}
.search{width:100%;height:48px;border-radius:16px;border:1px solid var(--glass-b);background:rgba(255,255,255,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);padding:0 16px;margin-bottom:12px;outline:none;transition:box-shadow .2s}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 3px rgba(47,107,88,.16),var(--shadow)}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:16px}

.big{font-size:38px;font-weight:750;letter-spacing:-.035em;line-height:1.1}
.facts{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.facts div{padding:13px 16px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.facts div:nth-child(odd){border-left:0}.facts div:nth-child(-n+2){border-top:0}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts b{font-weight:600}
.rows{overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);transition:background .3s}
.rw:first-child{border-top:0}
.rw .n{width:30px;height:30px;border-radius:11px;background:rgba(160,135,95,.12);color:var(--muted);font-size:12px;font-weight:650;display:grid;place-items:center;flex:none}
.rw .n svg{width:15px;height:15px}
.rw.paid .n,.rw.pay .n{background:var(--accent-soft);color:var(--accent)}
.rw.overdue .n,.rw.add .n{background:var(--warn-soft);color:var(--warn)}
.rw .g{flex:1;min-width:0}
.rw .g small{display:block;color:var(--muted);font-size:12px}
.rw.overdue .g small{color:var(--warn)}
.rw.paid .am{color:var(--muted)}
.rw .am{font-weight:650}
.rw.pay .am{color:var(--accent)}.rw.add .am{color:var(--warn)}
.rw.flash{animation:flash 1.6s ease-out,rise .45s var(--ease)}
.rw.out,.tile.out{animation:out .28s ease-in forwards}
.x{width:34px;height:34px;border-radius:12px;color:var(--muted);display:grid;place-items:center;flex:none;transition:background .2s}
.x:active{background:rgba(160,135,95,.15)}
.x svg{width:17px;height:17px}
.x.star.on{color:var(--gold)}

.link{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px}
.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.files{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.done svg.ok circle{stroke:var(--accent);stroke-width:3;fill:rgba(47,107,88,.08);stroke-dasharray:240;stroke-dashoffset:240;animation:draw .6s ease-out forwards}

.done p{color:var(--muted);margin:6px 0 14px;white-space:pre-line}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:rgba(255,255,255,.92);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid #fff;color:var(--ink);font-weight:550;
  padding:12px 20px;border-radius:18px;font-size:14px;animation:toast 2.4s var(--ease) forwards;max-width:calc(90vw / var(--z,1));text-align:center;box-shadow:0 12px 34px rgba(70,58,40,.22)}
.view{position:fixed;inset:0;z-index:80;background:rgba(40,34,26,.82);display:grid;place-items:center;animation:fade .2s;padding:16px}
.view img{max-width:100%;max-height:100%;border-radius:14px;animation:pop .3s var(--ease)}
.auth{max-width:440px;margin:6vh auto 0}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes flash{0%,30%{background:rgba(47,107,88,.14)}}
@keyframes out{to{opacity:0;transform:translateX(30px) scale(.96)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px) scale(.95)}10%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-6px)}}

/* пинг в кружке «Обновить» */
@property --pq{syntax:'<number>';inherits:true;initial-value:0}
.rfr .pgb{display:none}
.rfr.pg>svg{display:none}.rfr.pg .pgb{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px;animation:pop .35s var(--ease)}
.pgb b{font:760 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .4s}
.pgb small{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rfr.pg{--pc:#9C9384;transition:--pq .7s var(--ease),transform .15s}
.rfr.pg:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2.5px;pointer-events:none;
  background:conic-gradient(from -90deg,var(--pc) calc(var(--pq)*360deg),rgba(160,135,95,.16) 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.rfr.pg:after{content:"";position:absolute;inset:6px;border-radius:12px;background:radial-gradient(circle at 50% 40%,var(--pc),transparent 70%);opacity:.12;pointer-events:none}
.rfr.good{--pc:#3F8A72}.rfr.good .pgb b{color:#2F6B58}
.rfr.mid{--pc:#C0913A}.rfr.mid .pgb b{color:#9A7128}
.rfr.bad,.rfr.off{--pc:#C2603F}.rfr.bad .pgb b,.rfr.off .pgb b{color:var(--warn)}

/* ---- скорость: анимация появления — только у первых 16 строк; движущиеся пятна и иконки — на своих слоях ---- */
main.enter .list>*:nth-child(n+17){animation:none}
.kpi:after,.kpi .ic{will-change:transform}
/* ---- режим «настоящее приложение»: без выделения, без масштабирования жестами, без прокрутки вбок ---- */
html,body{overscroll-behavior:none;overscroll-behavior-y:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
@supports(overflow:clip){html{overflow-x:clip}body{overflow-x:clip}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable],.sel,.sel *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,a{-webkit-user-drag:none}
button,a,label,[data-a]{touch-action:manipulation}
img,video{max-width:100%}
@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}
html.lite body:before,html.lite .kpi:after{animation:none!important}
